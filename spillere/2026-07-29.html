<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Norsk lytting – synkronisert tekst</title>
<style>
  :root {
    --bg: #faf9f6;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-dim: #888;
    --highlight: #fff3b0;
    --highlight-border: #f0c000;
    --accent: #1a6b8a;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 { font-size: 1.3rem; font-weight: 600; }
  .header .date { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

  /* Player card */
  .player-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 20px;
    position: sticky;
    top: 10px;
    z-index: 10;
  }

  .audio-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  audio {
    flex: 1;
    height: 40px;
  }

  .speed-btns {
    display: flex;
    gap: 4px;
  }
  .speed-btns button {
    padding: 6px 12px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.15s;
  }
  .speed-btns button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .speed-btns button:hover { border-color: var(--accent); }

  .progress-bar {
    margin-top: 12px;
    height: 4px;
    background: #eee;
    border-radius: 2px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s linear;
    width: 0%;
  }

  /* Text display */
  .text-display {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px;
  }

  .cue-line {
    padding: 10px 14px;
    margin: 4px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    font-size: 1.05rem;
  }
  .cue-line:hover {
    background: #f5f5f5;
  }
  .cue-line.active {
    background: var(--highlight);
    border-left-color: var(--highlight-border);
    font-weight: 500;
    box-shadow: 0 1px 4px rgba(240,192,0,0.15);
  }
  .cue-line.past {
    color: var(--text-dim);
  }

  .cue-index {
    display: inline-block;
    width: 28px;
    color: #bbb;
    font-size: 0.75rem;
    text-align: right;
    margin-right: 12px;
    user-select: none;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .player-card, .text-display { padding: 14px; }
    .cue-line { font-size: 0.95rem; padding: 8px 10px; }
    .player-card { position: relative; top: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">Norsk nyheter – lytting</h1>
  <div class="date" id="date-display"></div>
</div>

<div class="player-card">
  <div class="audio-row">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="speed-btns">
      <button data-rate="0.75">0.75×</button>
      <button data-rate="1" class="active">1×</button>
      <button data-rate="1.25">1.25×</button>
    </div>
  </div>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="text-display" id="text-display"><p style="color:#888;font-size:0.85rem;">Laster tekst ...</p></div>

<script>
// ============ CONFIG (replaced by generator) ============
const AUDIO_URL = '2026-07-29.mp3';
const TITLE = 'Dagens nyheter -- 29. juli 2026';
const DATE_STR = '2026-07-29';
// VTT data embedded directly for single-file sharing:
const VTT_DATA = `1
00:00:04,100 --> 00:00:09,840
Tirsdag denne uken skjedde det en eksplosjon om bord på et stort tankskip utenfor Skjærhalden.

2
00:00:10,440 --> 00:00:15,640
Skipet tilhører Utkilen AS, et velkjent rederi med hovedkontor i Bergen.

3
00:00:16,400 --> 00:00:25,020
Rederiet har en lang historie som strekker seg helt tilbake til 1916, og de driver i dag med transport av kjemikalier over hele verden.

4
00:00:26,240 --> 00:00:31,100
Tankskipet er 120 meter langt og var ute på oppdrag da eksplosjonen skjedde.

5
00:00:32,160 --> 00:00:34,400
Heldigvis var tanken tom da det smalt.

6
00:00:35,240 --> 00:00:41,000
Det betyr at det ikke var farlige kjemikalier eller olje om bord i den tanken som eksploderte.

7
00:00:42,340 --> 00:00:50,520
Rederidirektøren i Utkilen har uttalt til Bergensavisen at det var en tom tank som eksploderte, noe som trolig reddet situasjonen fra å bli mye verre.

8
00:00:52,100 --> 00:00:58,620
Ifølge NRK Vestland mener eksperter at sveising er den sannsynlige årsaken til eksplosjonen.

9
00:00:59,060 --> 00:01:04,180
Sveising er en vanlig arbeidsmetode på skip -- man bruker varme til å smelte sammen metalldeler.

10
00:01:05,400 --> 00:01:09,040
Men hvis det er gass eller damp i nærheten, kan det være veldig farlig.

11
00:01:09,840 --> 00:01:13,840
En liten gnist kan antenne gassen og føre til en kraftig eksplosjon.

12
00:01:14,860 --> 00:01:20,500
Politiet og Sjøfartsdirektoratet etterforsker nå saken for å finne ut nøyaktig hva som skjedde.

13
00:01:21,680 --> 00:01:25,600
Heldigvis ble ingen personer alvorlig skadet i eksplosjonen.

14
00:01:26,200 --> 00:01:29,720
Det er en stor lettelse for både rederiet og de ansatte om bord.

15
00:01:30,580 --> 00:01:36,400
Utkilen har rundt 16 tankskip i flåten sin, og selskapet er en viktig arbeidsgiver i Bergens-området.

16
00:01:37,600 --> 00:01:53,720
Hendelsen viser hvor viktig sikkerhetsrutiner er i maritim industri -- selv en rutineoppgave som sveising kan føre til alvorlige ulykker hvis man ikke følger sikkerhetsreglene nøye. Denne typen ulykker blir alltid grundig undersøkt i Norge.

17
00:01:54,860 --> 00:01:59,600
Målet er å lære av det som skjedde, slik at lignende hendelser kan unngås i fremtiden.

18
00:02:00,460 --> 00:02:09,840
For Bergen, som er en av Norges viktigste skipsfartsbyer, er sjøsikkerhet et tema som angår mange -- både de som jobber i næringen og folk som bor langs kysten.

19
00:02:10,540 --> 00:02:13,520
Har du kjent en spesiell lukt i Bergen de siste dagene?

20
00:02:14,240 --> 00:02:15,540
I så fall er du ikke alene.

21
00:02:16,420 --> 00:02:22,660
NRK Vestland melder at innbyggerne i Bergen har kjent en tydelig røyklukt -- og den kommer helt fra Canada.

22
00:02:23,480 --> 00:02:28,500
Hvert år opplever Canada store skogbranner om sommeren, og i år er intet unntak.

23
00:02:29,420 --> 00:02:41,240
Flere store skogbranner herjer nå i de vestlige delene av Canada, spesielt i provinsene British Columbia og Alberta. Men hvordan kan røyklukt reise fra Canada til Bergen?

24
00:02:41,980 --> 00:02:55,680
Svaret ligger i jetstrømmene -- kraftige vinder som blåser høyt oppe i atmosfæren, ofte mellom 8 og 12 kilometer over jordens overflate. Disse vindene kan bære røykpartikler over enorme avstander.

25
00:02:56,480 --> 00:03:07,240
Når skogbrannene i Canada er spesielt kraftige, kan røyken stige så høyt opp at jetstrømmene fanger den og frakter den over Atlanterhavet til Norge og resten av Europa.

26
00:03:08,080 --> 00:03:15,080
Fenomenet er ikke helt nytt, men det blir mer og mer vanlig etter hvert som skogbrannene blir større og mer intense.

27
00:03:16,540 --> 00:03:25,040
Klimaendringene spiller en viktig rolle her: varmere og tørrere somre i Canada gjør at skogbranner starter lettere og sprer seg raskere.

28
00:03:26,460 --> 00:03:30,680
Meteorologer i Norge følger nøye med på røykskyene via satellittbilder.

29
00:03:31,500 --> 00:03:36,240
De kan se hvordan røyken beveger seg over Atlanterhavet og når Norge i løpet av noen dager.

30
00:03:37,660 --> 00:03:42,180
Ifølge Meteorologisk institutt er røyklukten i Bergen ikke farlig for helsen.

31
00:03:42,960 --> 00:03:48,420
Røyken er så høyt oppe i atmosfæren at konsentrasjonen av partikler ved bakkenivå er svært lav.

32
00:03:49,320 --> 00:03:54,260
Likevel kan personer med astma eller andre luftveisproblemer merke litt irritasjon.

33
00:03:55,060 --> 00:04:00,620
Eksperter anbefaler at folk med slike helseplager holder seg innendørs hvis lukten blir veldig sterk.

34
00:04:02,220 --> 00:04:06,660
Dette er et fascinerende eksempel på hvor sammenkoblet verden vår er.

35
00:04:07,340 --> 00:04:13,120
En skogbrann i Canada kan påvirke luftkvaliteten i Bergen -- over 6000 kilometer unna.

36
00:04:13,880 --> 00:04:17,280
Det minner oss om at miljøproblemer ikke kjenner landegrenser.

37
00:04:18,300 --> 00:04:26,180
Klimaendringene som forårsaker flere skogbranner i Canada, er de samme klimaendringene som fører til mer ekstremvær også her i Norge.
`;
// ========================================================

document.getElementById('title').textContent = TITLE;
document.getElementById('date-display').textContent = DATE_STR;

const audio = document.getElementById('audio');
const textDisplay = document.getElementById('text-display');
const progressFill = document.getElementById('progress-fill');
const speedBtns = document.querySelectorAll('.speed-btns button');

let cues = [];
let currentCueIdx = -1;

// --- Parse VTT (embedded data) ---
function loadVTT() {
  cues = parseVTT(VTT_DATA);
  console.log('VTT cues loaded:', cues.length);
  buildCueElements();
  // Show first cue as indicator
  if (cues.length > 0) {
    const info = document.createElement('div');
    info.style.cssText = 'font-size:0.75rem;color:#aaa;margin-bottom:8px;padding:0 14px;';
    info.textContent = cues.length + ' avsnitt lastet';
    textDisplay.insertBefore(info, textDisplay.firstChild);
  }
}

function parseVTT(raw) {
  const result = [];
  const blocks = raw.trim().split(/\n\s*\n/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    if (lines.length < 2) continue;
    // Find the timing line: 00:00:00.000 --> 00:00:00.000
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const times = timeLine.split('-->').map(t => parseTime(t.trim()));
    if (times.length !== 2) continue;
    const text = lines.slice(lines.indexOf(timeLine) + 1).join(' ').trim();
    if (!text) continue;
    result.push({ start: times[0], end: times[1], text });
  }
  return result;
}

function parseTime(t) {
  // HH:MM:SS.mmm or MM:SS.mmm
  const parts = t.split(':');
  let h = 0, m = 0, s = 0;
  if (parts.length === 3) {
    h = parseInt(parts[0]); m = parseInt(parts[1]); s = parseFloat(parts[2]);
  } else if (parts.length === 2) {
    m = parseInt(parts[0]); s = parseFloat(parts[1]);
  }
  return h * 3600 + m * 60 + s;
}

function buildCueElements() {
  textDisplay.innerHTML = '';
  cues.forEach((cue, i) => {
    const div = document.createElement('div');
    div.className = 'cue-line';
    div.innerHTML = `<span class="cue-index">${i + 1}</span>${cue.text}`;
    div.addEventListener('click', () => {
      audio.currentTime = cue.start;
      audio.play();
    });
    div.dataset.index = i;
    textDisplay.appendChild(div);
  });
}

// --- Sync ---
function updateActiveCue() {
  const t = audio.currentTime;
  let newIdx = -1;
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i].start && t < cues[i].end) { newIdx = i; break; }
  }
  if (newIdx === currentCueIdx) return;
  
  // Remove old active
  if (currentCueIdx >= 0) {
    const old = textDisplay.querySelector(`[data-index="${currentCueIdx}"]`);
    if (old) {
      old.classList.remove('active');
      if (currentCueIdx < newIdx || (newIdx === -1 && t > cues[currentCueIdx].end)) {
        old.classList.add('past');
      }
    }
  }
  
  currentCueIdx = newIdx;
  if (newIdx >= 0) {
    const el = textDisplay.querySelector(`[data-index="${newIdx}"]`);
    if (el) {
      el.classList.remove('past');
      el.classList.add('active');
      // Scroll into view smoothly
      // Scroll into view (commented: causes issues in WeChat browser)
      // el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function updateProgress() {
  if (audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
}

audio.addEventListener('timeupdate', () => {
  updateActiveCue();
  updateProgress();
});

audio.addEventListener('play', () => {
  if (cues.length > 0 && currentCueIdx < 0) updateActiveCue();
});

// --- Speed control ---
speedBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const rate = parseFloat(btn.dataset.rate);
    audio.playbackRate = rate;
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// --- Init ---
audio.src = AUDIO_URL;
try {
  loadVTT();
} catch(err) {
  textDisplay.innerHTML = `<p style="color:#c00;">⚠️ Kunne ikke laste tekst: ${err.message}</p>`;
}
</script>
</body>
</html>
