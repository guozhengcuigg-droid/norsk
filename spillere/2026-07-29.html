<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Norsk lytting – synkronisert tekst</title>
<style>
  :root {
    --bg: #faf9f6;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-dim: #888;
    --highlight: #fff3b0;
    --highlight-border: #f0c000;
    --accent: #1a6b8a;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 { font-size: 1.3rem; font-weight: 600; }
  .header .date { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

  /* Player card */
  .player-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 20px;
    position: sticky;
    top: 10px;
    z-index: 10;
  }

  .audio-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  audio {
    flex: 1;
    height: 40px;
  }

  .speed-btns {
    display: flex;
    gap: 4px;
  }
  .speed-btns button {
    padding: 6px 12px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.15s;
  }
  .speed-btns button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .speed-btns button:hover { border-color: var(--accent); }

  .progress-bar {
    margin-top: 12px;
    height: 4px;
    background: #eee;
    border-radius: 2px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s linear;
    width: 0%;
  }

  /* Text display */
  .text-display {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px;
  }

  .cue-line {
    padding: 10px 14px;
    margin: 4px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    font-size: 1.05rem;
  }
  .cue-line:hover {
    background: #f5f5f5;
  }
  .cue-line.active {
    background: var(--highlight);
    border-left-color: var(--highlight-border);
    font-weight: 500;
    box-shadow: 0 1px 4px rgba(240,192,0,0.15);
  }
  .cue-line.past {
    color: var(--text-dim);
  }

  .cue-index {
    display: inline-block;
    width: 28px;
    color: #bbb;
    font-size: 0.75rem;
    text-align: right;
    margin-right: 12px;
    user-select: none;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .player-card, .text-display { padding: 14px; }
    .cue-line { font-size: 0.95rem; padding: 8px 10px; }
    .player-card { position: relative; top: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">Norsk nyheter – lytting</h1>
  <div class="date" id="date-display"></div>
</div>

<div class="player-card">
  <div class="audio-row">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="speed-btns">
      <button data-rate="0.75">0.75×</button>
      <button data-rate="1" class="active">1×</button>
      <button data-rate="1.25">1.25×</button>
    </div>
  </div>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="text-display" id="text-display"><p style="color:#888;font-size:0.85rem;">Laster tekst ...</p></div>

<script>
// ============ CONFIG (replaced by generator) ============
const AUDIO_URL = '2026-07-29.mp3';
const TITLE = 'Dagens nyheter – 29. juli 2026';
const DATE_STR = '2026-07-29';
// VTT data embedded directly for single-file sharing:
const VTT_DATA = `1
00:00:03,420 --> 00:00:07,060

2
00:00:07,860 --> 00:00:14,780
Det var ikke en vanlig brann i nabolaget – røyken kom fra massive skogbranner i Canada, tusenvis av kilometer unna.

3
00:00:15,700 --> 00:00:21,340
Selv oljeplattformer ute i Nordsjøen ringte til Meteorologisk institutt for å spørre hva som brant.

4
00:00:22,160 --> 00:00:29,800
Forklaringen var at kraftig vestavind hadde fraktet røyken og forurensningen over Atlanterhavet, helt til Norges kyst.

5
00:00:30,480 --> 00:00:32,460
Bildet av brannene er tatt 25.

6
00:00:32,780 --> 00:00:35,320
juli vest for Cache Creek i British Columbia.

7
00:00:37,000 --> 00:00:43,460
Statsmeteorolog Leonidas Tsopoluridis i Bergen forklarte hvordan røyken kunne luktes så tydelig på Vestlandet.

8
00:00:44,580 --> 00:00:47,660
– Røyken og forurensningen blir dratt ned til bakken med nedbøren.

9
00:00:48,320 --> 00:00:59,900
Siden Bergen er en by med mye regn, er det her den havner, sa meteorologen. På lørdag kjente man røyklukten i rundt 30 minutter, mens den på søndag varte i omtrent 10 minutter.

10
00:01:00,680 --> 00:01:05,880
Regnet fungerte altså som en renseprosess som brakte røykpartiklene ned fra atmosfæren.

11
00:01:07,160 --> 00:01:19,060
Meteorologen understreket at røyken ikke utgjorde noen helsefare for folk i Norge. – Røyken er så uttynnet etter reisen over Atlanterhavet at den ikke er farlig å puste inn, sa Tsopoluridis.

12
00:01:19,980 --> 00:01:24,700
Likevel var det en interessant påminnelse om hvordan alt i naturen henger sammen.

13
00:01:25,300 --> 00:01:30,000
En skogbrann i Nord-Amerika kan faktisk påvirke luftkvaliteten i Europa.

14
00:01:30,980 --> 00:01:38,760
Dette er ikke første gang det skjer – en lignende situasjon oppsto også i 2023 etter store kanadiske skogbranner.

15
00:01:39,600 --> 00:01:43,720
Nå har vindmønsteret endret seg, og røyken beveger seg bort fra Vestlandet.

16
00:01:44,460 --> 00:01:51,220
De neste dagene og inn i den kommende uken er det Østlandet og Sørlandet som får besøk av røykpartiklene.

17
00:01:51,960 --> 00:01:59,960
Men siden det er sol og oppholdsvær i øst, vil de verken merke røyken eller lukten på samme måte som bergenserne gjorde i helgen.

18
00:02:01,060 --> 00:02:08,340
– Østlandet kan glede seg over spesielt fine, guloransje og idylliske solnedganger de nærmeste dagene, sa meteorologen.

19
00:02:10,420 --> 00:02:17,980
Røykpartiklene i atmosfæren kan nemlig spre sollyset på en spesiell måte og gi ekstra vakre farger når solen går ned om kvelden.

20
00:02:18,700 --> 00:02:19,580
– Jeg kunne ikke si nei.

21
00:02:20,280 --> 00:02:23,260
Jeg bare måtte si ja, sier Annett Garvik (50) fra Bergen.

22
00:02:24,040 --> 00:02:27,580
De fleste må bare tenke på om formen er god nok før en fjelltur.

23
00:02:29,220 --> 00:02:40,220
Rullestolbruker Annett må tenke på helt andre ting. Men forrige uke fikk hun en uventet melding fra prosjektet «Fjellet for alle», som spurte om hun ville være med til Trolltunga.

24
00:02:40,780 --> 00:02:47,240
– De spurte om jeg ville til Trolltunga om en uke. Da var det bare å grave frem fjellteltet fra loftet, forteller hun.

25
00:02:48,180 --> 00:02:54,280
«Fjellet for alle» er et prosjekt drevet av den kristne organisasjonen Gi en hjelpende hånd.

26
00:02:54,820 --> 00:03:02,340
Målet er å hjelpe rullestolbrukere opp på høye fjelltopper, slik at de kan oppleve norsk natur på samme måte som alle andre.

27
00:03:03,760 --> 00:03:18,940
Daglig leder Arthur Enders startet prosjektet etter å ha sett hvor mye moren hans i Latvia ønsket å komme seg ut i naturen. – Hun ville alltid ut i naturen, men det var ikke mulig fordi vi var så fattige og ikke hadde rullestol, forklarer Enders.

28
00:03:19,680 --> 00:03:25,940
Da han flyttet til Norge, ville han gi andre rullestolbrukere de opplevelsene moren hans aldri fikk.

29
00:03:26,880 --> 00:03:32,940
Turen opp til Trolltunga er bratt og krevende – normalt tar den 10 til 12 timer for en vanlig turgåer.

30
00:03:33,880 --> 00:03:39,100
Et turfølge på rundt 20 personer ble med Annett, og åtte av dem hjalp til med løftingen.

31
00:03:39,960 --> 00:03:44,680
Hun satt i en spesiallaget rullestol med bare ett hjul og håndtak på alle sider.

32
00:03:45,640 --> 00:03:50,420
Rullestolen er laget av en fabrikk i Frankrike som produserer utstyr for offroad og fjell.

33
00:03:51,300 --> 00:03:55,820
I de tyngste partiene sto hjelperne tett i tett rundt stolen for å løfte.

34
00:03:57,000 --> 00:04:01,020
– Til tider fløy jeg mer over bakken enn jeg kjørte, og det var kjempetungt for dem.

35
00:04:01,980 --> 00:04:04,000
Jeg var som en keiserinne, ler Annett.

36
00:04:04,880 --> 00:04:11,820
I tillegg til den fysiske utfordringen hadde Annett en annen ting å overvinne: hun sliter med høydeskrekk.

37
00:04:12,620 --> 00:04:18,240
– Jeg kjente på høydeskrekken, men heldigvis var det folk rundt meg nesten hele tiden, sier hun.

38
00:04:19,300 --> 00:04:24,660
Etter nesten fem timer nådde gruppen endelig Trolltunga, 1100 meter over havet.

39
00:04:25,740 --> 00:04:28,040

40
00:04:28,700 --> 00:04:32,160

41
00:04:32,900 --> 00:04:35,720

00:04:36,420 --> 00:04:42,040

43
00:04:43,260 --> 00:04:48,540

44
00:04:49,360 --> 00:04:51,200
– Det ga meg en følelse av fellesskap.

45
00:04:51,960 --> 00:04:54,060
Det er utrolig hva vi kan få til sammen.

46
00:04:54,720 --> 00:04:57,060
Det var fellesskapet som fikk meg opp, sier hun.

47
00:04:57,680 --> 00:05:02,720
Annett har gradvis blitt mer avhengig av rullestol helt siden hun var i 20-årene.

48
00:05:03,920 --> 00:05:11,600
– I starten prøvde jeg å unngå å bruke rullestolen, men så innså jeg at jeg kommer mye lenger med rullestol enn uten, forteller hun.

49
00:05:12,520 --> 00:05:18,700
Hun håper å nå fem fjelltopper innen året er omme, selv om de ikke trenger å være like krevende som Trolltunga.

50
00:05:20,500 --> 00:05:23,580
– En tur trenger ikke å være til Trolltunga for å være ekstrem.

51
00:05:24,180 --> 00:05:26,120
Du må finne det som er ekstremt for deg.

52
00:05:27,120 --> 00:05:32,020

`;
// ========================================================

document.getElementById('title').textContent = TITLE;
document.getElementById('date-display').textContent = DATE_STR;

const audio = document.getElementById('audio');
const textDisplay = document.getElementById('text-display');
const progressFill = document.getElementById('progress-fill');
const speedBtns = document.querySelectorAll('.speed-btns button');

let cues = [];
let currentCueIdx = -1;

// --- Parse VTT (embedded data) ---
function loadVTT() {
  cues = parseVTT(VTT_DATA);
  console.log('VTT cues loaded:', cues.length);
  buildCueElements();
  // Show first cue as indicator
  if (cues.length > 0) {
    const info = document.createElement('div');
    info.style.cssText = 'font-size:0.75rem;color:#aaa;margin-bottom:8px;padding:0 14px;';
    info.textContent = cues.length + ' avsnitt lastet';
    textDisplay.insertBefore(info, textDisplay.firstChild);
  }
}

function parseVTT(raw) {
  const result = [];
  const blocks = raw.trim().split(/\n\s*\n/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    if (lines.length < 2) continue;
    // Find the timing line: 00:00:00.000 --> 00:00:00.000
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const times = timeLine.split('-->').map(t => parseTime(t.trim()));
    if (times.length !== 2) continue;
    const text = lines.slice(lines.indexOf(timeLine) + 1).join(' ').trim();
    if (!text) continue;
    result.push({ start: times[0], end: times[1], text });
  }
  return result;
}

function parseTime(t) {
  // HH:MM:SS.mmm or MM:SS.mmm
  const parts = t.split(':');
  let h = 0, m = 0, s = 0;
  if (parts.length === 3) {
    h = parseInt(parts[0]); m = parseInt(parts[1]); s = parseFloat(parts[2]);
  } else if (parts.length === 2) {
    m = parseInt(parts[0]); s = parseFloat(parts[1]);
  }
  return h * 3600 + m * 60 + s;
}

function buildCueElements() {
  textDisplay.innerHTML = '';
  cues.forEach((cue, i) => {
    const div = document.createElement('div');
    div.className = 'cue-line';
    div.innerHTML = `<span class="cue-index">${i + 1}</span>${cue.text}`;
    div.addEventListener('click', () => {
      audio.currentTime = cue.start;
      audio.play();
    });
    div.dataset.index = i;
    textDisplay.appendChild(div);
  });
}

// --- Sync ---
function updateActiveCue() {
  const t = audio.currentTime;
  let newIdx = -1;
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i].start && t < cues[i].end) { newIdx = i; break; }
  }
  if (newIdx === currentCueIdx) return;
  
  // Remove old active
  if (currentCueIdx >= 0) {
    const old = textDisplay.querySelector(`[data-index="${currentCueIdx}"]`);
    if (old) {
      old.classList.remove('active');
      if (currentCueIdx < newIdx || (newIdx === -1 && t > cues[currentCueIdx].end)) {
        old.classList.add('past');
      }
    }
  }
  
  currentCueIdx = newIdx;
  if (newIdx >= 0) {
    const el = textDisplay.querySelector(`[data-index="${newIdx}"]`);
    if (el) {
      el.classList.remove('past');
      el.classList.add('active');
      // Scroll into view smoothly
      // Scroll into view (commented: causes issues in WeChat browser)
      // el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function updateProgress() {
  if (audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
}

audio.addEventListener('timeupdate', () => {
  updateActiveCue();
  updateProgress();
});

audio.addEventListener('play', () => {
  if (cues.length > 0 && currentCueIdx < 0) updateActiveCue();
});

// --- Speed control ---
speedBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const rate = parseFloat(btn.dataset.rate);
    audio.playbackRate = rate;
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// --- Init ---
audio.src = AUDIO_URL;
try {
  loadVTT();
} catch(err) {
  textDisplay.innerHTML = `<p style="color:#c00;">⚠️ Kunne ikke laste tekst: ${err.message}</p>`;
}
</script>
</body>
</html>
