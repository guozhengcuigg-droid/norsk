<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Norsk lytting – synkronisert tekst</title>
<style>
  :root {
    --bg: #faf9f6;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-dim: #888;
    --highlight: #fff3b0;
    --highlight-border: #f0c000;
    --accent: #1a6b8a;
    --radius: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 { font-size: 1.3rem; font-weight: 600; }
  .header .date { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }

  /* Player card */
  .player-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 20px;
    position: sticky;
    top: 10px;
    z-index: 10;
  }

  .audio-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  audio {
    flex: 1;
    height: 40px;
  }

  .speed-btns {
    display: flex;
    gap: 4px;
  }
  .speed-btns button {
    padding: 6px 12px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.15s;
  }
  .speed-btns button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .speed-btns button:hover { border-color: var(--accent); }

  .progress-bar {
    margin-top: 12px;
    height: 4px;
    background: #eee;
    border-radius: 2px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s linear;
    width: 0%;
  }

  /* Text display */
  .text-display {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px;
  }

  .cue-line {
    padding: 10px 14px;
    margin: 4px 0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    font-size: 1.05rem;
  }
  .cue-line:hover {
    background: #f5f5f5;
  }
  .cue-line.active {
    background: var(--highlight);
    border-left-color: var(--highlight-border);
    font-weight: 500;
    box-shadow: 0 1px 4px rgba(240,192,0,0.15);
  }
  .cue-line.past {
    color: var(--text-dim);
  }

  .cue-index {
    display: inline-block;
    width: 28px;
    color: #bbb;
    font-size: 0.75rem;
    text-align: right;
    margin-right: 12px;
    user-select: none;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .player-card, .text-display { padding: 14px; }
    .cue-line { font-size: 0.95rem; padding: 8px 10px; }
    .player-card { position: relative; top: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">Norsk nyheter – lytting</h1>
  <div class="date" id="date-display"></div>
</div>

<div class="player-card">
  <div class="audio-row">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="speed-btns">
      <button data-rate="0.75">0.75×</button>
      <button data-rate="1" class="active">1×</button>
      <button data-rate="1.25">1.25×</button>
    </div>
  </div>
  <div class="progress-bar"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="text-display" id="text-display"><p style="color:#888;font-size:0.85rem;">Laster tekst ...</p></div>

<script>
// ============ CONFIG (replaced by generator) ============
const AUDIO_URL = '2026-08-05.mp3';
const TITLE = 'Dagens nyheter – 5. august 2026';
const DATE_STR = '2026-08-05';
// VTT data embedded directly for single-file sharing:
const VTT_DATA = `1
00:00:03,280 --> 00:00:09,360

2
00:00:10,200 --> 00:00:22,600

3
00:00:23,320 --> 00:00:32,100
Sepp Blatter var president i FIFA fra 1998 til 2015. Han er en svært kontroversiell person i fotballhistorien.

4
00:00:32,700 --> 00:00:38,820
I 2015 ble han utestengt fra all fotballvirksomhet på grunn av etiske brudd og korrupsjonsanklager.

5
00:00:40,100 --> 00:00:49,940
Mange ble overrasket da Blatter denne uken offentlig uttalte at Klaveness er den beste kandidaten til å ta over etter Gianni Infantino, som er dagens FIFA-president.

6
00:00:51,040 --> 00:00:56,280
Infantino har vært FIFA-president siden 2016, men nå er han under sterkt press.

7
00:00:57,600 --> 00:01:03,680
Forrige uke måtte han trekke tilbake en plan om å selge deler av VM-rettighetene til eksterne investorer.

8
00:01:04,520 --> 00:01:08,780
Planen møtte massiv motstand fra fotballforbund over hele verden.

9
00:01:09,560 --> 00:01:14,080
Både Sverige og England har offisielt trukket sin støtte til Infantino.

10
00:01:15,160 --> 00:01:29,620
Avisen The Athletic melder også at flere amerikanske VM-byer fortsatt venter på millioner av kroner som FIFA lovet dem etter sommerens fotball-VM. Lise Klaveness har markert seg som en modig og prinsippfast leder.

11
00:01:30,140 --> 00:01:40,120
Under FIFA-kongressen i Doha i 2022 holdt hun en berømt tale der hun kritiserte FIFA for manglende respekt for menneskerettigheter i forbindelse med fotball-VM i Qatar.

12
00:01:41,620 --> 00:01:48,320
Hun sa at fotballen må ta ansvar for arbeidernes rettigheter og for LHBT+-personers sikkerhet.

13
00:01:49,200 --> 00:01:58,100
Talen fikk stor oppmerksomhet over hele verden, og mange mente det var modig av en liten nasjon som Norge å si ifra så tydelig.

14
00:01:59,000 --> 00:02:20,100
Klaveness er utdannet jurist og har selv spilt fotball på høyt nivå. Hun har 73 landskamper for det norske kvinnelandslaget, og hun spilte i Toppserien for flere klubber, inkludert Trondheims-Ørn og Asker. Hun la opp som spiller i 2008 og begynte deretter en karriere som jurist.

15
00:02:20,880 --> 00:02:25,640
Hun har blant annet jobbet som dommerfullmektig og advokat før hun gikk inn i fotballadministrasjon.

16
00:02:26,420 --> 00:02:32,080
Hun kommer opprinnelig fra Frekhaug i Alver kommune, rett over fjorden fra Bergen sentrum.

17
00:02:33,840 --> 00:02:42,360
Frekhaug er en liten by med rundt 3 000 innbyggere, men nå kan en person derfra bli en av de mest innflytelsesrike personene i internasjonal idrett.

18
00:02:43,220 --> 00:02:52,520
At en person fra Vestlandet kan bli verdens mektigste person i fotball, er en stor nyhet for hele regionen, og mange bergensere følger spent med på utviklingen.

19
00:02:53,480 --> 00:03:00,460
NRK Dagsrevyen hadde et eget innslag om saken tirsdag kveld, der de diskuterte Klaveness' sjanser til å bli valgt.

20
00:03:01,260 --> 00:03:10,240
Selv om det er uklart når et eventuelt presidentvalg i FIFA vil skje, har diskusjonen om hvem som skal ta over etter Infantino allerede begynt.

Lise Klaveness fra Frekhaug er nå en av de heteste kandidatene, og hennes kandidatur viser at norsk fotball har fått en sterk stemme internasjonalt.

22
00:03:21,180 --> 00:03:26,720

23
00:03:28,560 --> 00:03:45,040
Da Castro scoret et viktig mål for Brann, feiret han ved å vise langfingeren – en gest som vanligvis blir sett på som svært usportslig. Brann vant kampen mot Rosenborg 3-2 på Brann Stadion, og stemningen var elektrisk blant de over 15 000 tilskuerne.

24
00:03:45,800 --> 00:03:54,900
Castro, som er en viktig angrepsspiller for Brann, scoret et av målene som sikret seieren. Men gleden ble blandet med bekymring da TV-bildene viste finger-gesten hans.

25
00:03:56,360 --> 00:04:14,400
Norges Fotballforbunds (NFF) disiplinærutvalg har sett på saken denne uken. Onsdag morgen kom avgjørelsen: Castro slipper straff. Utvalget mener at gesten ikke var rettet mot noen spesifikk person, og at den ikke var så alvorlig at den fortjener en utestengelse eller bot.

26
00:04:15,300 --> 00:04:20,420
Dette er gode nyheter for Brann og for Castro, som slipper å miste viktige kamper.

27
00:04:21,120 --> 00:04:27,880
Brann kjemper for tiden om en topplassering i Eliteserien, og Castro er en nøkkelspiller i lagets angrep.

00:04:28,620 --> 00:04:34,380
Hadde han blitt utestengt, kunne det fått store konsekvenser for lagets prestasjoner i de kommende kampene.

00:04:34,860 --> 00:04:40,480
Niklas Castro kom til Brann i 2023 og har siden vært en publikumsfavoritt på Stadion.

30
00:04:41,220 --> 00:04:47,720
Han er kjent for sin tekniske ferdighet og sitt temperament på banen – noen ganger kanskje litt for mye av det siste.

31
00:04:48,660 --> 00:04:56,280
Han har tidligere spilt for Aalesund og for klubber i Chile, og han har representert det chilenske landslaget på ungdomsnivå.

32
00:04:57,260 --> 00:05:05,740
Flere kommentatorer har sagt at Castro bør passe på hvordan han feirer mål i fremtiden, selv om NFF denne gangen lot ham slippe unna.

33
00:05:06,520 --> 00:05:12,260
En finger-gest kan lett misforstås, og i verste fall kan det provosere motspillere og publikum.

34
00:05:13,040 --> 00:05:17,780
Heldigvis for Castro og Brann valgte NFF å se mildt på hendelsen denne gangen.

35
00:05:18,300 --> 00:05:36,180
Det er ikke første gang en spiller i Eliteserien viser følelser på en upassende måte, men NFFs avgjørelse viser at de vurderer hver sak individuelt. For Brann-fansen er det uansett en lettelse at deres stjernespiller kan fortsette å spille uten avbrudd.

36
00:05:36,840 --> 00:05:41,840
Neste kamp for Brann er allerede til helgen, og Castro er ventet å starte på topp.
`;
// ========================================================

document.getElementById('title').textContent = TITLE;
document.getElementById('date-display').textContent = DATE_STR;

const audio = document.getElementById('audio');
const textDisplay = document.getElementById('text-display');
const progressFill = document.getElementById('progress-fill');
const speedBtns = document.querySelectorAll('.speed-btns button');

let cues = [];
let currentCueIdx = -1;

// --- Parse VTT (embedded data) ---
function loadVTT() {
  cues = parseVTT(VTT_DATA);
  console.log('VTT cues loaded:', cues.length);
  buildCueElements();
  // Show first cue as indicator
  if (cues.length > 0) {
    const info = document.createElement('div');
    info.style.cssText = 'font-size:0.75rem;color:#aaa;margin-bottom:8px;padding:0 14px;';
    info.textContent = cues.length + ' avsnitt lastet';
    textDisplay.insertBefore(info, textDisplay.firstChild);
  }
}

function parseVTT(raw) {
  const result = [];
  const blocks = raw.trim().split(/\n\s*\n/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    if (lines.length < 2) continue;
    // Find the timing line: 00:00:00.000 --> 00:00:00.000
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const times = timeLine.split('-->').map(t => parseTime(t.trim()));
    if (times.length !== 2) continue;
    const text = lines.slice(lines.indexOf(timeLine) + 1).join(' ').trim();
    if (!text) continue;
    result.push({ start: times[0], end: times[1], text });
  }
  return result;
}

function parseTime(t) {
  // HH:MM:SS.mmm or MM:SS.mmm
  const parts = t.split(':');
  let h = 0, m = 0, s = 0;
  if (parts.length === 3) {
    h = parseInt(parts[0]); m = parseInt(parts[1]); s = parseFloat(parts[2]);
  } else if (parts.length === 2) {
    m = parseInt(parts[0]); s = parseFloat(parts[1]);
  }
  return h * 3600 + m * 60 + s;
}

function buildCueElements() {
  textDisplay.innerHTML = '';
  cues.forEach((cue, i) => {
    const div = document.createElement('div');
    div.className = 'cue-line';
    div.innerHTML = `<span class="cue-index">${i + 1}</span>${cue.text}`;
    div.addEventListener('click', () => {
      audio.currentTime = cue.start;
      audio.play();
    });
    div.dataset.index = i;
    textDisplay.appendChild(div);
  });
}

// --- Sync ---
function updateActiveCue() {
  const t = audio.currentTime;
  let newIdx = -1;
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i].start && t < cues[i].end) { newIdx = i; break; }
  }
  if (newIdx === currentCueIdx) return;
  
  // Remove old active
  if (currentCueIdx >= 0) {
    const old = textDisplay.querySelector(`[data-index="${currentCueIdx}"]`);
    if (old) {
      old.classList.remove('active');
      if (currentCueIdx < newIdx || (newIdx === -1 && t > cues[currentCueIdx].end)) {
        old.classList.add('past');
      }
    }
  }
  
  currentCueIdx = newIdx;
  if (newIdx >= 0) {
    const el = textDisplay.querySelector(`[data-index="${newIdx}"]`);
    if (el) {
      el.classList.remove('past');
      el.classList.add('active');
      // Scroll into view smoothly
      // Scroll into view (commented: causes issues in WeChat browser)
      // el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

function updateProgress() {
  if (audio.duration) {
    progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
}

audio.addEventListener('timeupdate', () => {
  updateActiveCue();
  updateProgress();
});

audio.addEventListener('play', () => {
  if (cues.length > 0 && currentCueIdx < 0) updateActiveCue();
});

// --- Speed control ---
speedBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const rate = parseFloat(btn.dataset.rate);
    audio.playbackRate = rate;
    speedBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// --- Init ---
audio.src = AUDIO_URL;
try {
  loadVTT();
} catch(err) {
  textDisplay.innerHTML = `<p style="color:#c00;">⚠️ Kunne ikke laste tekst: ${err.message}</p>`;
}
</script>
</body>
</html>
